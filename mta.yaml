_schema-version: 3.3.0
ID: sap-gov-sandbox
version: 1.0.0
description: "Governed maintenance stock validation service: deterministic lookups + audit trail on SAP HANA Cloud"
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: sap-gov-sandbox-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: sap-gov-sandbox-db
      - name: sap-gov-sandbox-auth
      - name: gov-dest-admin   # destination lookups (GovLedgerService)

  - name: sap-gov-sandbox-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: sap-gov-sandbox-db

resources:
  - name: gov-dest-admin
    type: org.cloudfoundry.existing-service
  - name: sap-gov-sandbox-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: sap-gov-sandbox-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: sap-gov-sandbox-${org}-${space}
        tenant-mode: dedicated
